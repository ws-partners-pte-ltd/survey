<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSP Radar</title>

    <!-- Favicon設定 -->
    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Tailwind は事前ビルド済みCSSを同梱（実行時に外部CDNのスクリプトを読み込まない） -->
    <link rel="stylesheet" href="/assets/tailwind-individual.css">

    <script crossorigin src="/assets/react.production.min.js"></script>
    <script crossorigin src="/assets/react-dom.production.min.js"></script>

    <!-- ★外部ファイル (config.js) の読み込み -->
    <script src="./config.js"></script>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans relative">
    <div id="root" class="flex-1 flex flex-col w-full h-full"></div>
    <script src="app.js"></script>
</body>
</html>
